
<!doctype html>
<html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>SAU Mess Scan</title>
<style>
:root{--maroon:#7b1e2b;--gold:#c9a227}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#111;color:#fff;text-align:center}
.box{padding:12px;max-width:480px;margin:auto}
input,button{font-size:18px;padding:10px;margin:6px 0;width:100%;box-sizing:border-box}

/* app header */
#app header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--maroon);border-bottom:3px solid var(--gold);text-align:left}
.brand{font-weight:800;letter-spacing:1px;font-size:18px}
.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:2px;font-weight:600}
.who{font-size:12px;opacity:.85;margin-right:10px}
.ghost{width:auto;margin:0;padding:6px 12px;font-size:14px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px}
#reader{width:calc(100% - 24px);max-width:420px;margin:14px auto 0;border-radius:16px;overflow:hidden;border:3px solid var(--gold);background:#000}
.hint{opacity:.7;font-size:14px;margin:8px 0}
.manual{display:flex;gap:8px;max-width:420px;margin:10px auto;padding:0 12px}
.manual input{margin:0;flex:1;width:auto;border-radius:8px;border:1px solid #555;background:#222;color:#fff}
.manual button{margin:0;width:auto;background:var(--gold);color:#222;border:0;border-radius:8px;font-weight:700;padding:10px 16px}

/* result overlay */
#ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10;text-align:center;overflow:auto}
#ov.PAID{background:#14803a}
#ov.DUE{background:#b3261e}
#ov.DUPE{background:#e8a200;color:#222}
#ov.BLOCKED{background:#2b0b0b}
#ov.NOT_FOUND{background:#333}
#ov.ERR{background:#444}
.big{font-size:44px;font-weight:900;letter-spacing:1px}
.photo{width:190px;height:250px;object-fit:cover;border-radius:12px;border:4px solid #fff;background:rgba(0,0,0,.25);margin:14px 0}
.name{font-size:26px;font-weight:800}
.line{font-size:18px;margin-top:4px}
.due{font-size:30px;font-weight:800;margin-top:10px}
.meal{font-size:14px;letter-spacing:2px;opacity:.85;margin-top:2px}
.nextbtn{position:sticky;bottom:12px;width:100%;max-width:420px;margin-top:20px;padding:16px;font-size:20px;font-weight:800;letter-spacing:1px;border:0;border-radius:14px;background:#fff;color:#111;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#ov.DUPE .nextbtn{background:#222;color:#fff}
.photo{transition:opacity .3s;opacity:.35}
.photo.loaded{opacity:1}
</style></head><body>

<div id='login' class='box'>
  <h2>Mess Login</h2>
  <input id='em' placeholder='Email'>
  <input id='pw' type='password' placeholder='Password'>
  <button onclick='login()'>Login</button>
  <div id='err'></div>
</div>

<div id='app' style='display:none'>
  <header>
    <div class='brand'>SAU MESS<small>SCAN COUNTER</small></div>
    <div style='display:flex;align-items:center'>
      <span class='who' id='who'></span>
      <button class='ghost' onclick='logout()'>Logout</button>
    </div>
  </header>
  <div id='reader'></div>
  <div class='hint'>QR ko camera ke saamne rakho</div>
  <div class='manual'>
    <input id='roll' placeholder='Mess card no (card bhool gaya)'>
    <button onclick='manual()'>Search</button>
  </div>
  <div id='ov'></div>
</div>

<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'></script>
<script>
const sb = supabase.createClient('https://vcnaltvzdkgovhhkbzbq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjbmFsdHZ6ZGtnb3ZoaGtiemJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MjI1MDAsImV4cCI6MjEwODI5ODUwMH0.4kyj7jjIAmUT5XAELnt9LqG3AXe968DMSQ3MS1V-fKU');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let busy = false, scanner = null, actx = null;

function unlock() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
document.addEventListener('click', unlock);

function beep(ok) {
  try {
    unlock();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value = ok ? 880 : 220;
    g.gain.value = 0.15;
    o.start(); o.stop(actx.currentTime + (ok ? 0.15 : 0.4));
  } catch (e) {}
}

function fmtDate(s) {
  if (!s) return '-';
  return new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

async function login() {
  unlock();
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) { $('err').textContent = 'Login failed'; return; }
  start();
}

async function logout() {
  if (scanner) { try { await scanner.stop(); } catch (e) {} }
  await sb.auth.signOut(); location.hash = ''; location.reload();
}

async function start() {
  $('login').style.display = 'none'; $('app').style.display = 'block';
  const { data } = await sb.auth.getSession();
  if (data.session) $('who').textContent = (data.session.user.email || '').split('@')[0];
  scanner = new Html5Qrcode('reader');
  scanner.start({ facingMode: 'environment' },
    { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1 }, onScan)
    .catch(e => alert('Camera error: ' + e));
  if (location.hash.startsWith('#t=')) {
    const t = location.hash.slice(3);
    history.replaceState(null, '', location.pathname);
    call(t, false);
  }
}

function onScan(text) {
  const key = text.includes('#t=') ? text.split('#t=')[1] : text;
  call(key, false);
}

function manual() {
  const r = $('roll').value.trim();
  if (r) { $('roll').value = ''; call(r, true); }
}

async function call(key, byCard) {
  if (busy) return; busy = true;
  try {
    const { data, error } = await sb.rpc('scan_card', { p_key: key, p_by_roll: byCard });
    if (error) throw error;
    await show(data);
  } catch (e) {
    overlay('ERR', `<div class='big'>ERROR</div><div class='line'>${esc(e.message || e)}</div>`, false);
  }
}

function overlay(cls, html, ok) {
  const ov = $('ov');
  ov.className = cls;
  ov.innerHTML = html + `<button class='nextbtn' onclick='closeResult()'>NEXT SCAN</button>`;
  ov.style.display = 'flex';
  ov.scrollTop = 0;
  beep(ok);
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [200, 100, 200]);
}

function closeResult() {
  $('ov').style.display = 'none';
  setTimeout(() => { busy = false; }, 400);
}

async function show(r) {
  if (r.result === 'NOT_FOUND') {
    overlay('NOT_FOUND', `<div class='big'>INVALID CARD</div><div class='line'>Ye card system mein nahi hai</div>`, false);
    return;
  }
  let cls = r.result, title = r.result, extra = '';
  if (r.result === 'PAID') {
    title = '\u2713 PAID';
    if (r.already_scanned) {
      cls = 'DUPE'; title = '\u26a0 ALREADY SCANNED';
      const t = new Date(r.prev_time).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      extra = `<div class='line'><b>Pehle scan: ${esc(t)}</b></div>`;
    }
  } else if (r.result === 'DUE') {
    title = '\u2717 DUE';
  } else if (r.result === 'BLOCKED') {
    title = '\u26d4 CARD BLOCKED';
  }
  const due = Number(r.due_amount) > 0 ? `<div class='due'>Due: \u20b9${esc(r.due_amount)}</div>` : '';
  const html = `<div class='big'>${title}</div>`
    + `<div class='meal'>${esc((r.meal || '').toUpperCase())}</div>`
    + extra
    + `<img id='ph' class='photo' alt=''>`
    + `<div class='name'>${esc(r.name)}</div>`
    + `<div class='line'>Roll: ${esc(r.roll_no)} &nbsp;|&nbsp; Card: ${esc(r.mess_card_no)}</div>`
    + `<div class='line'>Paid upto: <b>${esc(fmtDate(r.paid_upto))}</b></div>`
    + due;
  overlay(cls, html, r.result === 'PAID' && !r.already_scanned);
  if (r.photo_file) {
    const { data } = await sb.storage.from('photos').createSignedUrl(r.photo_file, 60);
    if (data && data.signedUrl) {
      const img = $('ph');
      img.onload = () => img.classList.add('loaded');
      img.src = data.signedUrl;
    }
  }
}

sb.auth.getSession().then(({ data }) => { if (data.session) start(); });
</script></body></html>
